<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151e32" />
      <stop offset="100%" stop-color="#0f1626" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.8" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1080" height="1350" fill="url(#bgGrad)" />
  <rect width="1080" height="1350" fill="url(#dotGrid)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="300" fill="#1d4ed8" opacity="0.15" filter="blur(80px)" />
  <circle cx="880" cy="700" r="350" fill="#7c3aed" opacity="0.12" filter="blur(90px)" />
  <circle cx="300" cy="1150" r="280" fill="#059669" opacity="0.1" filter="blur(80px)" />

  <!-- ── HEADER ────────────────────────────────────────────────── -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="18" cy="18" r="5" fill="#22c55e" />
    <text x="32" y="23" fill="#cbd5e1" font-size="13" font-weight="700" letter-spacing="1">SYNAPSE NOTES v0.2</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-size="52" font-weight="800" letter-spacing="-1">The AI-Native Notebook</text>
    <text x="0" y="145" fill="#94a3b8" font-size="22" font-weight="400">What we built for Samsung Galaxy Tab S-Pen &amp; AI Agents</text>
  </g>

  <!-- ── 4 CORE PILLARS ────────────────────────────────────────── -->

  <!-- CARD 1: S-Pen & Handwriting OCR -->
  <g transform="translate(80, 280)" filter="url(#cardShadow)">
    <rect width="440" height="420" rx="18" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <!-- Header Accent Bar -->
    <rect x="0" y="0" width="440" height="4" rx="2" fill="url(#blueGrad)" />

    <!-- Icon Badge -->
    <rect x="32" y="32" width="48" height="48" rx="12" fill="#1e3a8a" />
    <path d="M48 62 L64 46 L68 50 L52 66 Z M45 65 L48 62 L52 66 Z" fill="#60a5fa" />

    <text x="92" y="54" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1">CANVAS &amp; OCR</text>
    <text x="92" y="74" fill="#f8fafc" font-size="19" font-weight="700">S-Pen Ink &amp; Search</text>

    <!-- Content Items -->
    <g transform="translate(32, 115)">
      <!-- Item 1 -->
      <circle cx="8" cy="8" r="4" fill="#3b82f6" />
      <text x="24" y="13" fill="#f1f5f9" font-size="16" font-weight="600">Ray-Cast Lasso Tool</text>
      <text x="24" y="34" fill="#94a3b8" font-size="13">Point-in-polygon selection, drag &amp; duplicate</text>

      <!-- Item 2 -->
      <circle cx="8" cy="70" r="4" fill="#3b82f6" />
      <text x="24" y="75" fill="#f1f5f9" font-size="16" font-weight="600">Per-Segment Pressure Taper</text>
      <text x="24" y="96" fill="#94a3b8" font-size="13">Sub-pixel variable line-width for natural ink</text>

      <!-- Item 3 -->
      <circle cx="8" cy="132" r="4" fill="#3b82f6" />
      <text x="24" y="137" fill="#f1f5f9" font-size="16" font-weight="600">On-Device Tesseract.js OCR</text>
      <text x="24" y="158" fill="#94a3b8" font-size="13">2x DPI worker indexing ink for instant search</text>

      <!-- Tech Tag Pill -->
      <rect x="0" y="215" width="130" height="28" rx="14" fill="#1e293b" />
      <text x="14" y="233" fill="#93c5fd" font-size="11" font-weight="600">Local Browser Worker</text>
    </g>
  </g>

  <!-- CARD 2: Structured PDF Annotation Layer -->
  <g transform="translate(560, 280)" filter="url(#cardShadow)">
    <rect width="440" height="420" rx="18" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="440" height="4" rx="2" fill="url(#amberGrad)" />

    <rect x="32" y="32" width="48" height="48" rx="12" fill="#78350f" />
    <path d="M48 46 H68 V66 H48 Z M52 50 H64 M52 56 H64 M52 62 H60" stroke="#fbbf24" stroke-width="2" fill="none" />

    <text x="92" y="54" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1">PDF ENGINE</text>
    <text x="92" y="74" fill="#f8fafc" font-size="19" font-weight="700">Slide Annotation Layer</text>

    <g transform="translate(32, 115)">
      <!-- Item 1 -->
      <circle cx="8" cy="8" r="4" fill="#f59e0b" />
      <text x="24" y="13" fill="#f1f5f9" font-size="16" font-weight="600">Structured Markups</text>
      <text x="24" y="34" fill="#94a3b8" font-size="13">Translucent highlights, underlines &amp; sticky notes</text>

      <!-- Item 2 -->
      <circle cx="8" cy="70" r="4" fill="#f59e0b" />
      <text x="24" y="75" fill="#f1f5f9" font-size="16" font-weight="600">Annotation Drawer</text>
      <text x="24" y="96" fill="#94a3b8" font-size="13">1-click jump-to-slide index across entire deck</text>

      <!-- Item 3 -->
      <circle cx="8" cy="132" r="4" fill="#f59e0b" />
      <text x="24" y="137" fill="#f1f5f9" font-size="16" font-weight="600">pdf-lib Vector Re-Export</text>
      <text x="24" y="158" fill="#94a3b8" font-size="13">Annotations burn directly into standard vector PDFs</text>

      <!-- Tech Tag Pill -->
      <rect x="0" y="215" width="135" height="28" rx="14" fill="#1e293b" />
      <text x="14" y="233" fill="#fcd34d" font-size="11" font-weight="600">Dual-Mode SVG + Canvas</text>
    </g>
  </g>

  <!-- CARD 3: SM-2 Spaced Repetition Flashcards -->
  <g transform="translate(80, 740)" filter="url(#cardShadow)">
    <rect width="440" height="420" rx="18" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="440" height="4" rx="2" fill="url(#purpleGrad)" />

    <rect x="32" y="32" width="48" height="48" rx="12" fill="#4c1d95" />
    <path d="M48 50 L58 44 L68 50 L68 62 L58 68 L48 62 Z" stroke="#a78bfa" stroke-width="2" fill="none" />

    <text x="92" y="54" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="1">STUDY MODE</text>
    <text x="92" y="74" fill="#f8fafc" font-size="19" font-weight="700">SM-2 Spaced Repetition</text>

    <g transform="translate(32, 115)">
      <!-- Item 1 -->
      <circle cx="8" cy="8" r="4" fill="#8b5cf6" />
      <text x="24" y="13" fill="#f1f5f9" font-size="16" font-weight="600">Active Recall Deck</text>
      <text x="24" y="34" fill="#94a3b8" font-size="13">3D flip review cards generated directly by AI agents</text>

      <!-- Item 2 -->
      <circle cx="8" cy="70" r="4" fill="#8b5cf6" />
      <text x="24" y="75" fill="#f1f5f9" font-size="16" font-weight="600">SuperMemo-2 Algorithm</text>
      <text x="24" y="96" fill="#94a3b8" font-size="13">Repetition intervals &amp; ease factor calibration</text>

      <!-- Item 3 -->
      <circle cx="8" cy="132" r="4" fill="#8b5cf6" />
      <text x="24" y="137" fill="#f1f5f9" font-size="16" font-weight="600">LaTeX &amp; Mermaid Integration</text>
      <text x="24" y="158" fill="#94a3b8" font-size="13">Math formulas &amp; architecture diagrams in reviews</text>

      <!-- Tech Tag Pill -->
      <rect x="0" y="215" width="130" height="28" rx="14" fill="#1e293b" />
      <text x="14" y="233" fill="#c4b5fd" font-size="11" font-weight="600">Pure TypeScript SM-2</text>
    </g>
  </g>

  <!-- CARD 4: Offline PWA & Enterprise Security -->
  <g transform="translate(560, 740)" filter="url(#cardShadow)">
    <rect width="440" height="420" rx="18" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="440" height="4" rx="2" fill="url(#emeraldGrad)" />

    <rect x="32" y="32" width="48" height="48" rx="12" fill="#064e3b" />
    <path d="M58 44 L68 49 V59 C68 65 58 68 58 68 C58 68 48 65 48 59 V49 Z" stroke="#34d399" stroke-width="2" fill="none" />

    <text x="92" y="54" fill="#34d399" font-size="12" font-weight="700" letter-spacing="1">CORE &amp; SECURITY</text>
    <text x="92" y="74" fill="#f8fafc" font-size="19" font-weight="700">Offline PWA &amp; Security</text>

    <g transform="translate(32, 115)">
      <!-- Item 1 -->
      <circle cx="8" cy="8" r="4" fill="#10b981" />
      <text x="24" y="13" fill="#f1f5f9" font-size="16" font-weight="600">Offline Sync Queue</text>
      <text x="24" y="34" fill="#94a3b8" font-size="13">Write offline; auto background sync on reconnect</text>

      <!-- Item 2 -->
      <circle cx="8" cy="70" r="4" fill="#10b981" />
      <text x="24" y="75" fill="#f1f5f9" font-size="16" font-weight="600">Hardened SSRF &amp; IDOR</text>
      <text x="24" y="96" fill="#94a3b8" font-size="13">Domain allowlisting, 50MB caps &amp; ownership checks</text>

      <!-- Item 3 -->
      <circle cx="8" cy="132" r="4" fill="#10b981" />
      <text x="24" y="137" fill="#f1f5f9" font-size="16" font-weight="600">Multi-Tier Storage</text>
      <text x="24" y="158" fill="#94a3b8" font-size="13">Cloudflare R2, Vercel Blob &amp; Neon Postgres</text>

      <!-- Tech Tag Pill -->
      <rect x="0" y="215" width="130" height="28" rx="14" fill="#1e293b" />
      <text x="14" y="233" fill="#6ee7b7" font-size="11" font-weight="600">Zero-Leak Security</text>
    </g>
  </g>

  <!-- ── FOOTER ────────────────────────────────────────────────── -->
  <g transform="translate(80, 1200)">
    <rect width="920" height="70" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

    <!-- GitHub Icon & Path -->
    <path d="M36 35 C36 28.37 41.37 23 48 23 C53.3 23 57.84 26.44 59.44 31.24 C60.04 31.13 60.67 31.13 61.27 31.24 C62.87 26.44 67.41 23 72.71 23 C79.34 23 84.71 28.37 84.71 35 C84.71 43.14 74.36 50.41 61.03 57 C47.7 50.41 36 43.14 36 35 Z" fill="#64748b" opacity="0.3" />
    <text x="36" y="41" fill="#f8fafc" font-size="15" font-weight="700">Open Source on GitHub</text>
    <text x="220" y="41" fill="#60a5fa" font-size="14" font-family="monospace">github.com/Rajveerx11/synapse-notes</text>

    <!-- Stack Badges -->
    <text x="680" y="41" fill="#94a3b8" font-size="13" font-weight="600">Next.js 15 • TypeScript • MCP • S-Pen</text>
  </g>
</svg>
